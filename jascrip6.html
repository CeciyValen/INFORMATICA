<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--ejemplo 4.1-->
    <h3>El ciclo for:</h3>
<p>Ejemplo: imprimir los números del 1 al 5.</p>
<button id="ejemplo1" type="button">Ver</button>

 <!--ejemplo 4.2-->
 <h3>El ciclo while:</h3>
 <p>Ejemplo: cuenta regresiva.</p>
 <button id="ejemplo2" type="button">Ver</button>

  <!--ejemplo 4.3-->


<script>
    //implementacion del ejemplo 4.1
const btn1 = document.querySelector("#ejemplo1");
btn1.addEventListener("click", function() {
let mensaje = "Imprimiendo números del 1 al 5:\n";
for (let i = 1; i <= 5; i++) {
mensaje += "Número " + i + "\n";
}
alert(mensaje);
});

//implementacion del ejemplo 4.2
const btn2 = document.querySelector("#ejemplo2");
btn2.addEventListener("click", function() {
let mensaje = "Cuenta regresiva:\n";
let numero = 5;
while (numero > 0) {
mensaje += "Número: " + numero + "\n";
numero--;
}
alert(mensaje);
});

//implementacion del ejemplo 4.3

</script>
</body>
</html>
